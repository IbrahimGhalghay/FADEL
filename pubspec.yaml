name: fadel_debt_tracker
description: "Client debt & credit tracker for FADEL — Arabic RTL, Firebase-synced."
publish_to: 'none'

version: 1.3.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  package_info_plus: ^10.2.0
  crypto: ^3.0.7
  pdf: ^3.13.0
  share_plus: ^13.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  # Arabic font embedded in printed receipts (pdf package needs a raw TTF).
  assets:
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf
