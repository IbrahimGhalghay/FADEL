name: fadel_debt_tracker
description: "Client debt & credit tracker for FADEL — Arabic RTL, Firebase-synced."
publish_to: 'none'

version: 1.4.1+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  crypto: ^3.0.7
  pdf: ^3.13.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
flutter:
  uses-material-design: true

  # Arabic font embedded in printed receipts (pdf package needs a raw TTF).
  assets:
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf
